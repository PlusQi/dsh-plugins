# dsh-plugins bundle patch: one row per plugin in this pack.
# Each row id is pack-scoped and prefixed to never collide with dsh-base /
# dsh-web-app builtin ids (patch layers override by id). A plugin can be
# disabled per-profile from the profile's own cordis.patch.yml:
#   - id: tokprev
#     disabled: true
- insert:
    # tokprev: composer 下一轮 token 预告行 + 每轮收尾真实消耗徽标
    - id: tokprev
      name: 'dsh-plugins'
